name: 同步衛福部函釋

on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 1"

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 取出網站檔案
        uses: actions/checkout@v4

      - name: 同步衛福部法規檢索系統函釋
        run: python3 scripts/sync_mohw_interpretations.py

      - name: 提交同步結果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 同步衛福部函釋資料
          file_pattern: law/interpretations.js

      - name: 重新觸發 GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            /repos/${{ github.repository }}/pages/builds
